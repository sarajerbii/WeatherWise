server:
  port: 8085

spring:
  application:
    name: user-preferences-service
  datasource:
    url: jdbc:mysql://localhost:3306/preferences_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
