server:
  port: 8087

spring:
  application:
    name: air-quality-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/air_quality_db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true          # Eureka reçoit le vrai statut de /health
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: air-quality-service
    version: 1.0.0
    description: Microservice de gestion de la qualité de l'air
    team: WeatherWise