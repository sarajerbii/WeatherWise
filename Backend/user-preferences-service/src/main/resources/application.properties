# Service
spring.application.name=user-preferences-service
server.port=8085
  
  # Base de donnÃ©es : serveur MySQL partagÃ©, port 3306 (rapport, section 4.2)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:preferences_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
  
  # eureka registration (atelier Eureka, Partie 2, Ãtape 2)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
  
  # Exposer les endpoints health, info et metrics (seul health l'est par dÃ©faut)
management.endpoints.web.exposure.include=health,info,metrics
  
  # Afficher le dÃ©tail des composants dans /health (db, diskSpace, pingâ¦)
management.endpoint.health.show-details=always
  
  # Variante : afficher les composants sans leurs dÃ©tails
  #management.endpoint.health.show-components=always
  
  # Transmettre Ã  Eureka le statut de /health (le service passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
  
  # Publier les propriÃ©tÃ©s info.* dans /actuator/info (dÃ©sactivÃ© par dÃ©faut)
management.info.env.enabled=true
  
  # Contenu affichÃ© par /actuator/info
info.app.name=user-preferences-service
info.app.version=1.0.0
info.app.description=Microservice de gestion des prÃ©fÃ©rences utilisateur
info.app.team=WeatherWise
