server:
  port: 8083

spring:
  application:
    name: weather-alert-service
  datasource:
    url: jdbc:mysql://localhost:3306/alert_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true